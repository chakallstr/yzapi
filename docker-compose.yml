services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yzapi
      POSTGRES_PASSWORD: yzapi_dev_pw
      POSTGRES_DB: yzapi
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yzapi -d yzapi"]
      interval: 5s
      timeout: 3s
      retries: 10
